version: "3.8"

services:
  riderdb:
    image: mongo:6.0
    container_name: riderdb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: riderDB
    volumes:
      - rider_data:/data/db
      - ./init-mongo:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  rider-service:
    build: .
    container_name: rider-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://riderdb:27017/riderDB
    depends_on:
      - riderdb
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5005/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rider_data:
