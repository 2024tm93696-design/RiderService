version: "3.8"

services:
  riderdb:
    image: mongo:6.0
    container_name: riderdb
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_DATABASE: riderDB
    volumes:
      - rider_data:/data/db
      - ./init-mongo:/docker-entrypoint-initdb.d
    restart: always

  rider-service:
    build: .
    container_name: rider-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://riderdb:27017/riderDB
    depends_on:
      - riderdb
    restart: on-failure

volumes:
  rider_data:
